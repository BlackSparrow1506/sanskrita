name: परीक्षा (test suite)

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:

jobs:
  pariksha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the suite
        run: python3 परीक्षा.py
      - name: Property-based test (reference engine)
        run: python3 यादृच्छिकपरीक्षा.py --count 400 --seed 1 --only-reference

  vegah:
    name: वेगः (Rust engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: cargo fmt check
        run: cargo fmt --check
        working-directory: rust-engine
        continue-on-error: true
      - name: cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: rust-engine
        continue-on-error: true
      - name: cargo test
        run: cargo test
        working-directory: rust-engine
      - name: differential test vs Python reference
        run: python3 तुल्यता.py
      - name: property-based differential test (random programs, both engines)
        run: python3 यादृच्छिकपरीक्षा.py --count 400 --seed 1
      - name: benchmarks regenerate cleanly (§7c)
        run: python3 मापनम्.py --repeat 1 --dry-run > /dev/null
